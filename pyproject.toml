[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rocm-doctor"
version = "0.1.0"
description = "Diagnostic CLI for AMD GPU (ROCm) local LLM serving setups"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jhapendra Kandel" }]
keywords = ["rocm", "amd", "gpu", "ollama", "llm", "diagnostics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jhapendra-kandel/rocm-doctor"
Issues = "https://github.com/jhapendra-kandel/rocm-doctor/issues"

[project.scripts]
rocm-doctor = "rocm_doctor.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/rocm_doctor"]

[tool.ruff]
line-length = 100
